<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧牌對對 - 完整優化版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --bg-gradient: linear-gradient(180deg, #bfe3f7 0%, #cfeeff 35%, #dff6d6 70%,#b7e6a5 100%);
            --blue: #246bff;
            --black: #222;
            --white: #fff;
            --transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; }
        
        .app-container {
            width: clamp(280px, 95%, 750px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px; padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            text-align: center; border: 8px solid white; position: relative; z-index: 10;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .card {
            aspect-ratio: 1 / 1; border-radius: 20px;
            padding: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: clamp(0.85rem, 3vw, 1.2rem);
            cursor: pointer; background-color: #ffffff;
            border: 4px solid #f1f3f5; box-shadow: 0 6px 0 #dee2e6;
            line-height: 1.4; user-select: none; transition: var(--transition);
        }
        .card.selected { border-color: var(--secondary) !important; transform: scale(1.05); z-index: 2; box-shadow: 0 6px 0 #81e6d9; }
        .card.matched { opacity: 0.2; transform: scale(0.9); pointer-events: none; }
        .card.question { background: #eef5ff; color: var(--blue); border-color: #bcd3ff; }
        .card.answer { background: #f3fff1; color: var(--black); border-color: #bfe8c7; }

        .btn-main { background: var(--primary); color: white; padding: 12px 30px; border-radius: 50px; font-weight: 900; box-shadow: 0 6px 0 #d63031; border: none; cursor: pointer; }
        .btn-secondary { background: #6c757d; box-shadow: 0 6px 0 #495057; color: white; padding: 12px 30px; border-radius: 50px; font-weight: 900; border: none; cursor: pointer; }
        
        #overlay, #admin-login, #admin-panel {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 15px; border: 2px solid #eee; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 管理員按鈕（右上角齒輪圖示） -->
    <button id="admin-entry-btn" class="absolute top-4 right-4 text-gray-300 hover:text-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>

    <div class="mb-2"><span class="bg-yellow-100 text-yellow-700 px-4 py-1 rounded-full text-sm font-black">智慧稅趣園遊會</span></div>
    <h1 class="text-3xl font-black text-gray-800 mb-4"> 🚗智慧牌對對</h1>
    
    <div class="flex justify-between items-center bg-gray-50 rounded-2xl px-6 py-2 mb-4 border-2 border-dashed border-gray-200">
        <span id="progress-text" class="font-black text-gray-600">READY?</span>
    </div>

    <div class="grid-container" id="game-grid">
        <div class="col-span-3 py-20 text-gray-400 font-bold">請點擊下方按鈕開始</div>
    </div>

    <div class="mt-6 flex justify-center gap-4">
        <button id="start-btn" class="btn-main">GO! 開始挑戰</button>
    </div>
</div>

<!-- 結束通關畫面 -->
<div id="overlay">
    <div class="text-5xl font-black mb-4">🏆 挑戰完成！</div>
    <p id="final-time-display" class="text-xl mb-6 font-bold text-gray-600"></p>
    <button class="btn-main text-xl" id="reset-btn">下一位</button>
</div>

<!-- 管理員登入彈窗 -->
<div id="admin-login">
    <div class="bg-white p-8 rounded-3xl shadow-2xl border-4 border-gray-100 text-center">
        <h2 class="text-2xl font-black mb-4">管理員登入</h2>
        <input type="password" id="admin-pwd" placeholder="請輸入密碼" class="border-2 border-gray-200 rounded-xl px-4 py-2 mb-4 w-full outline-none focus:border-blue-400">
        <div class="flex gap-2">
            <button id="login-confirm-btn" class="btn-main flex-1">登入</button>
            <button id="login-cancel-btn" class="btn-secondary flex-1">取消</button>
        </div>
    </div>
</div>

<!-- 管理員數據後台 -->
<div id="admin-panel">
    <div class="bg-white p-6 rounded-3xl shadow-2xl w-11/12 max-w-2xl max-h-[90vh] overflow-y-auto">
        <h2 class="text-3xl font-black mb-6">數據統計中心</h2>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="stat-card">
                <div class="text-gray-500 text-sm">挑戰總人次</div>
                <div id="stat-players" class="text-2xl font-black text-blue-600">0</div>
            </div>
            <div class="stat-card">
                <div class="text-gray-500 text-sm">平均完成秒數</div>
                <div id="stat-avg" class="text-2xl font-black text-green-600">0</div>
            </div>
            <div class="stat-card">
                <div class="text-gray-500 text-sm">最快紀錄</div>
                <div id="stat-fast" class="text-2xl font-black text-orange-600">0</div>
            </div>
            <div class="stat-card">
                <div class="text-gray-500 text-sm">最慢紀錄</div>
                <div id="stat-slow" class="text-2xl font-black text-red-600">0</div>
            </div>
        </div>
        <div class="flex flex-col gap-3">
            <button id="export-excel-btn" class="btn-main w-full">匯出 Excel 完整報表</button>
            <button id="clear-data-btn" class="btn-secondary w-full bg-red-500 shadow-[0_6px_0_#c53030]">清空所有資料</button>
            <button id="close-admin-btn" class="btn-secondary w-full">返回遊戲頁面</button>
        </div>
    </div>
</div>

<script>
(() => {
    "use strict";

    const questionBank = [
        { q: "牌照稅何時開徵？", a: "每年 4 月" },
        { q: "身障者無駕照，其親屬車籍地需與身障者戶籍相同？", a: "正確" }, 
        { q: "牌照稅歸戶最多幾台車？", a: "5台" },
        { q: "身心障礙免稅額度為排氣量多少c.c.?", a: "2400c.c." },
        { q: "機車排氣量在多少C.C.數以上需徵牌照稅?", a: "151c.c." },
        { q: "每一身障者可申請免牌照稅車輛以幾輛為限?", a: "1輛" },
        { q: "身障無駕照，車輛限本人、配偶或同一戶籍幾親等?", a: "二親等" }
    ];

    const TOTAL_PAIRS = 3;
    let completedCount = 0;
    let firstChoice = null;
    let isProcessing = false;
    let startTime = 0;
    let currentPlayerID = ""; 
    let currentAttempts = [];

    function initGame() {
        completedCount = 0;
        firstChoice = null;
        isProcessing = false;
        currentAttempts = [];
        currentPlayerID = "T" + Date.now();
        startTime = Date.now();

        const grid = document.getElementById("game-grid");
        grid.innerHTML = "";
        document.getElementById("progress-text").innerText = `進度: 0 / ${TOTAL_PAIRS}`;

        const selected = [...questionBank]
            .sort(() => 0.5 - Math.random())
            .slice(0, TOTAL_PAIRS);

        const cards = [];
        selected.forEach((item, idx) => {
            cards.push({ id: idx, text: item.q, type: "question" });
            cards.push({ id: idx, text: item.a, type: "answer" });
        });

        cards.sort(() => 0.5 - Math.random());

        cards.forEach(c => {
            const el = document.createElement("div");
            el.className = `card ${c.type}`;
            el.innerText = c.text;
            el.dataset.pairId = c.id;
            el.dataset.type = c.type;
            el.onclick = () => handleCardClick(el);
            grid.appendChild(el);
        });
        document.getElementById("start-btn").parentElement.style.display = "none";
    }

    function handleCardClick(el) {
        if (isProcessing || el.classList.contains("matched") || el === firstChoice) return;
        el.classList.add("selected");
        if (!firstChoice) {
            firstChoice = el;
            return;
        }
        isProcessing = true;
        const isMatch = (firstChoice.dataset.pairId === el.dataset.pairId && firstChoice.dataset.type !== el.dataset.type);

        let qText = firstChoice.dataset.type === "question" ? firstChoice.innerText : el.innerText;
        let aText = firstChoice.dataset.type === "answer" ? firstChoice.innerText : el.innerText;
        
        currentAttempts.push({
            pID: currentPlayerID,
            時間: new Date().toLocaleString(),
            題目: qText,
            選擇答案: aText,
            結果: isMatch ? "正確" : "錯誤"
        });

        if (isMatch) {
            setTimeout(() => {
                firstChoice.classList.replace("selected", "matched");
                el.classList.replace("selected", "matched");
                completedCount++;
                document.getElementById("progress-text").innerText = `進度: ${completedCount} / ${TOTAL_PAIRS}`;
                firstChoice = null;
                isProcessing = false;
                if (completedCount === TOTAL_PAIRS) endGame();
            }, 300);
        } else {
            setTimeout(() => {
                firstChoice.classList.remove("selected");
                el.classList.remove("selected");
                firstChoice = null;
                isProcessing = false;
            }, 500);
        }
    }

    function endGame() {
        const timeUsed = ((Date.now() - startTime) / 1000).toFixed(1);
        let history = JSON.parse(localStorage.getItem("tt_history") || "[]");
        history.push({ pID: currentPlayerID, 完成時間: new Date().toLocaleString(), 耗時秒數: timeUsed });
        localStorage.setItem("tt_history", JSON.stringify(history));

        let logs = JSON.parse(localStorage.getItem("tt_logs") || "[]");
        logs.push(...currentAttempts.map(a => ({...a, 總耗時: timeUsed})));
        localStorage.setItem("tt_logs", JSON.stringify(logs));

        document.getElementById("final-time-display").innerText = `完成時間：${timeUsed} 秒`;
        document.getElementById("overlay").style.display = "flex";
    }

    function resetToHome() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("progress-text").innerText = "READY?";
        document.getElementById("game-grid").innerHTML = `<div class="col-span-3 py-20 text-gray-400 font-bold">請點擊下方按鈕開始</div>`;
        document.getElementById("start-btn").parentElement.style.display = "flex";
    }

    // --- 管理員功能獨立控制 ---
    const adminLogin = document.getElementById("admin-login");
    const adminPanel = document.getElementById("admin-panel");
    const pwdInput = document.getElementById("admin-pwd");

    // 打開登入彈窗
    document.getElementById("admin-entry-btn").onclick = () => {
        adminLogin.style.display = "flex";
    };

    // 在登入視窗按「取消」：清空密碼並直接關閉登入視窗
    document.getElementById("login-cancel-btn").onclick = () => {
        pwdInput.value = ""; 
        adminLogin.style.display = "none";
    };

    // 在後台面板按「返回遊戲頁面」：清空密碼並直接關閉後台面板
    document.getElementById("close-admin-btn").onclick = () => {
        pwdInput.value = ""; 
        adminPanel.style.display = "none";
    };
    
    // 密碼登入驗證
    document.getElementById("login-confirm-btn").onclick = () => {
        if (pwdInput.value === "231600") {
            adminLogin.style.display = "none"; // 關閉登入視窗
            adminPanel.style.display = "flex";  // 開啟後台面板
            updateStats();
        } else {
            alert("密碼錯誤！");
            pwdInput.value = ""; 
        }
    };

    function updateStats() {
        const h = JSON.parse(localStorage.getItem("tt_history") || "[]");
        document.getElementById("stat-players").innerText = h.length;
        if (h.length > 0) {
            const times = h.map(x => parseFloat(x.耗時秒數));
            const avg = (times.reduce((a, b) => a + b, 0) / times.length).toFixed(1);
            document.getElementById("stat-avg").innerText = avg;
            document.getElementById("stat-fast").innerText = Math.min(...times);
            document.getElementById("stat-slow").innerText = Math.max(...times);
        }
    }

    function exportExcel() {
        const logs = JSON.parse(localStorage.getItem("tt_logs") || "[]");
        const history = JSON.parse(localStorage.getItem("tt_history") || "[]");
        if (history.length === 0) return alert("尚無紀錄可匯出");

        const historySheetData = history.map((h, index) => ({
            "序號": index + 1,
            "完成時間": h.完成時間,
            "耗時(秒)": h.耗時秒數
        }));

        const logSheetData = logs.map((l, index) => {
            const playerIndex = history.findIndex(h => h.pID === l.pID);
            return {
                "序號": index + 1,
                "玩家次序": playerIndex + 1,
                "時間": l.時間,
                "題目": l.題目,
                "民眾選擇答案": l.選擇答案,
                "結果": l.結果,
                "該局總耗時": l.總耗時
            };
        });

        const ws1 = XLSX.utils.json_to_sheet(historySheetData);
        const ws2 = XLSX.utils.json_to_sheet(logSheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws1, "通關清單");
        XLSX.utils.book_append_sheet(wb, ws2, "詳細作答Log");
        XLSX.writeFile(wb, "智慧牌對對_統計報表.xlsx");
    }

    document.getElementById("export-excel-btn").onclick = exportExcel;
    document.getElementById("clear-data-btn").onclick = () => {
        if (confirm("確定要刪除所有遊戲紀錄嗎？此動作無法復原。")) {
            localStorage.removeItem("tt_history");
            localStorage.removeItem("tt_logs");
            updateStats();
            alert("資料已清空");
        }
    };

    document.getElementById("start-btn").onclick = initGame;
    document.getElementById("reset-btn").onclick = resetToHome;

})();
</script>
</body>
</html>
