<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, 
maximum-scale=1.0, user-scalable=no">
<title>智慧牌對對</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
    --primary: #FF6B6B;
    --secondary: #4ECDC4;
    --bg-gradient: linear-gradient(180deg, #bfe3f7 0%, #cfeeff 35%, #dff6d6 
70%,#b7e6a5 100%);
    /*內部顏色*/
    --blue: #246bff;
    --black: #222;
    --white: #fff;
    --pink: #ff5f9e;
    --green: #43c465;
    --orange: #ff9d2f;
    --danger: #ff5a5a;
    /*動畫速度*/
    --transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s 
ease;
    }
/*全域設定*/
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: 'Noto Sans TC', sans-serif; background: 
var(--bg-gradient); 
        display: flex; justify-content: center; align-items: center; }
.app-container {
    width: clamp(280px, 95%, 700px);
    background: rgba(255, 255, 255, 0.95);
    border-radius: 40px; padding: 25px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.15);
    text-align: center; border: 8px solid white; position: relative; z-index: 
10;
}
  
.grid-container {
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:12px;
}
/* 卡片基礎樣式 */
.card {
    aspect-ratio: 1 / 1;border-radius: 20px;
    padding: 8px;
    display: flex;align-items: center;justify-content: center;
    font-weight: 900;font-size: clamp(1rem, 3vw, 1.5rem);
    cursor: pointer;
    background-color: #ffffff;
    border: 4px solid #f1f3f5;
    box-shadow: 0 6px 0 #dee2e6;
    line-height: 1.4;
    user-select: none;
    transition: var(--transition);
}
.card.selected {
    border-color: var(--secondary) !important;
    transform: scale(1.05);
    z-index: 2;
    box-shadow: 0 6px 0 #81e6d9;
}
.card.matched {
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
}
.card.question{
  background:#eef5ff;
  color:var(--blue);
  border-color:#bcd3ff;
}
.card.answer{
  background:#f3fff1;
  color:var(--black);
  border-color:#bfe8c7;
}
.btn-main {
    background: var(--primary); color: white;
    padding: 12px 30px; border-radius: 50px; font-weight: 900;
    box-shadow: 0 6px 0 #d63031; border: none; cursor: pointer;
}
.btn-secondary {
    background: #6c757d;
    box-shadow: 0 6px 0 #495057;
    color: white;
    padding: 12px 30px;
    border-radius: 50px;
    font-weight: 900;
}   
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.98);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
</style>
  
</head>
<body>
<div class="app-container">
    <div class="mb-2"><span class="bg-yellow-100 text-yellow-700 px-4 py-1 
rounded-full text-sm font-black">智慧稅趣園遊會</span></div>
    <h1 class="text-3xl font-black text-gray-800 mb-4"> 🚗智慧牌對對</h1>
    <div class="flex justify-between items-center bg-gray-50 rounded-2xl px-6 
py-2 mb-4 border-2 border-dashed border-gray-200">
        <span id="progress-text" class="font-black text-gray-600">READY?</span>
    </div>
    <div class="grid-container" id="game-grid">
        <div class="col-span-4 py-10 text-gray-400 font-bold">請點擊下方按鈕開始
</div>
    </div>
    <div class="mt-6 flex justify-center gap-4">
        <button id="start-btn" class="btn-main" >
          GO! 開始挑戰
        </button>
        <button class="btn-secondary" id="export-btn">
          匯出報表
        </button>
    </div>
</div>
  
<div id="overlay">
    <div class="text-5xl font-black mb-4"> 🏆挑戰完成！</div>
    <button class="btn-main text-xl" id="reset-btn">
      下一位
    </button>
</div>
  
  
<script>
  (() => {
  "use strict";
  // 題庫：配對遊戲的問題與答案資料
const questionBank = [
    { q: "牌照稅何時開徵？", a: "每年 4 月" },
 { q: "身障者無駕照，二親等內親屬的什麼要跟身障者戶籍地相同", a: "車籍地、監理機關住居所地址" }, 
    { q: "牌照稅歸戶最多幾台車？", a: "5台" },
    { q: "身心障礙免稅額度為排氣量多少c.c.?", a: "2400c.c." },
    { q: "機車排氣量在多少C.C.數以上需徵使用牌照稅?", a: "151c.c." },
    { q: "每一身心障礙者可申請免使用牌照稅車輛以幾輛為限?", a: "1輛" },
    { q: "身障者無駕駛執照者，車輛限本人、配偶或同一戶籍幾親等內幾親屬所有?", a: "二親等" }
];
const TOTAL_PAIRS = 3;
let completedCount = 0;
let firstChoice = null;
let isProcessing = false;
let startTime = 0;
function initGame() {
    completedCount = 0;
    firstChoice = null;
    isProcessing = false;
    startTime = Date.now();
    const grid = document.getElementById("game-grid");
    grid.innerHTML = "";
    document.getElementById("progress-text").innerText = `進度: 0 / ${TOTAL_PAIRS}`;
    const selected = [...questionBank]
        .sort(() => 0.5 - Math.random())
        .slice(0, TOTAL_PAIRS);
    const cards = [];
    selected.forEach((item, idx) => {
        cards.push({ id: idx, text: item.q, type: "question" });
        cards.push({ id: idx, text: item.a, type: "answer" });
    });
    cards.sort(() => 0.5 - Math.random());
    cards.forEach(c => {
        const el = document.createElement("div");
        el.className = `card ${c.type}`;
        el.innerText = c.text;
        el.dataset.pairId = c.id;
        el.onclick = () => handle(el);
        grid.appendChild(el);
    });
}
function handle(el) {
    if (isProcessing || el.classList.contains("matched") || el === firstChoice) 
return;
    el.classList.add("selected");
    if (!firstChoice) {
        firstChoice = el;
        return;
    }
    isProcessing = true;
    if (Number(firstChoice.dataset.pairId) === Number(el.dataset.pairId)) {
        setTimeout(() => {
            firstChoice.classList.add("matched");
            el.classList.add("matched");
            completedCount++;
            document.getElementById("progress-text").innerText =
                `進度: ${completedCount} / ${TOTAL_PAIRS}`;
            firstChoice = null;
            isProcessing = false;
            if (completedCount === TOTAL_PAIRS) endGame();
        }, 300);
    } else {
        setTimeout(() => {
            firstChoice.classList.remove("selected");
            el.classList.remove("selected");
            firstChoice = null;
            isProcessing = false;
        }, 500);
    }
}
function endGame() {
    const timeUsed = ((Date.now() - startTime) / 1000).toFixed(1);
    let history = JSON.parse(localStorage.getItem("tt_history") || "[]");
    history.push({
        time: new Date().toLocaleString(),
        seconds: timeUsed,
        score: completedCount
    });
    localStorage.setItem("tt_history", JSON.stringify(history));
    document.getElementById("overlay").style.display = "flex";
}
function exportExcel() {
    let history = JSON.parse(localStorage.getItem("tt_history") || "[]");
    const ws = XLSX.utils.json_to_sheet(history);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "紀錄");
    XLSX.writeFile(wb, "智慧牌對對.xlsx");
}
function resetGame() {
    document.getElementById("overlay").style.display = "none";
    // 回到初始畫面
    document.getElementById("progress-text").innerText = "READY?";
    document.getElementById("game-grid").innerHTML = `
        <div class="col-span-4 py-10 text-gray-400 font-bold">
            請點擊下方按鈕開始
        </div>
    `;
    // 重置遊戲變數
    completedCount = 0;
    firstChoice = null;
    isProcessing = false;
    startTime = 0;
}
document.getElementById("start-btn").onclick = (e) => {
    e.target.disabled = true;
    initGame();
    setTimeout(() => e.target.disabled = false, 500);
};
document.getElementById("export-btn").onclick = exportExcel;
document.getElementById("reset-btn").onclick = resetGame;
})();
</script>
</body>
</html>
