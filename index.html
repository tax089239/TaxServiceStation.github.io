<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 租稅大冒險｜宣導活動入口</title>
<style>
/* ============================= */
/* 一、全頁面基本設定 */
/* ============================= */
body {
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(135deg, #fff9e6 0%, #ffe4e1 100%);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;    
    height: 100vh;
    overflow: hidden;
    position: relative;
}
/* ============================= */
/* 二、背景泡泡 */
/* ============================= */
.bubble {
     position: absolute;
     background: rgba(255, 255, 255, 0.6);
     border-radius: 50%;
     z-index: 0;
     pointer-events: none;
     box-shadow: 0 0 15px rgba(255, 200, 200, 0.5);
     animation: floatUp linear infinite;
}

@keyframes floatUp {
     0% { transform: translateY(0px); opacity: 0.9; }
     50% { opacity: 0.7; }
     100% { transform: translateY(-120vh); opacity: 0; }
}

/* ============================= */
/* 三、中央主卡片區塊 */
/* ============================= */
main {
    position: relative;
    z-index: 10;
    text-align: center;
}      
.container {      
    background: rgba(255, 255, 255, 0.95);
    padding: 50px 40px;
    border-radius: 30px;
    border: 5px solid #ffcfd2;
    box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
    max-width: 350px;
    width: 90%;
}

/* ============================= */
/* 四、標題與圖示 */
/* ============================= */
.header-icon {
    font-size: 60px;
    margin-bottom: 10px;
    display: block;
}

h1 {
    color: #ff6b6b;
    font-size: 28px;
    margin-bottom: 35px;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0px #fff;
 }

/* ============================= */
/* 五、按鈕樣式（升級遊戲風格） */
/* ============================= */
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 18px 0;
    padding: 18px;
    text-decoration: none;
    color: #2c3e50;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
    transition: all 0.25s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 12px 20px rgba(0,0,0,0.1);
    position: relative;
    top: 0;
}

.btn span { 
    margin-right: 10px; 
    font-size: 24px; 
}

/* ===== 各按鈕配色（統一設計系統） ===== */

/* 橘色：問答 */
.btn-quiz {background: #ff9f43;border-bottom: 6px solid #d97904; }

/* 藍色：卡牌 */
.btn-card {background: #48dbfb;border-bottom: 6px solid #1fa4c9;}

/* 綠色：尋寶1 */
.btn-find {background: #2ecc71;border-bottom: 6px solid #239b56;}

/* 深藍：尋寶2 */
.btn-find2 {background: #3498db;border-bottom: 6px solid #21618c;}

/* 紫色：拼圖 */
.btn-pintoo {background: #9b59b6;border-bottom: 6px solid #6c3483;}

/* ===== 動態效果 ===== */

.btn:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 12px 25px rgba(0,0,0,0.18);
    filter: brightness(1.08);
}

.btn:active {
    transform: translateY(4px) scale(0.98);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    border-bottom-width: 2px;
}

/* ============================= */
/* 六、底部提示文字 */
/* ============================= */
.footer-text {
    margin-top: 25px;
    font-size: 14px;
    color: #a0a0a0;
}
</style>
</head>
<body>

<!-- 背景泡泡 -->
<script>    
const bubbleCount = 25;
for(let i=0; i<bubbleCount; i++){
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random()*120 + 40; 
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px'; 
    bubble.style.left = Math.random()*90 + 5 + '%';
    bubble.style.bottom = (-Math.random()*100 - 100) + 'px';
    bubble.style.animationDuration = (Math.random()*6 + 8) + 's';
    bubble.style.animationDelay = (Math.random()*5) + 's';
    document.body.appendChild(bubble);
}
</script>

<main>
    <div class="container">
        <span class="header-icon">🌈</span>
        <h1>租稅大冒險</h1>
        <!-- 按鈕會由 JavaScript 動態生成 -->
        <p class="footer-text">一起學習正確的稅務知識吧！</p>
    </div>
</main>

<script>
// 取得容器
const container = document.querySelector('.container');

// 函式：新增按鈕
function addButton(text, emoji, href, btnClass) {
    const btn = document.createElement('a');
    btn.href = href;
    btn.className = 'btn ' + btnClass;

    const span = document.createElement('span');
    span.textContent = emoji;
    btn.appendChild(span);
    btn.appendChild(document.createTextNode(' ' + text));

    // 插入到 footer-text 之前，保持底部文字在最下方
    const footer = container.querySelector('.footer-text');
    container.insertBefore(btn, footer);
}

// 定義按鈕資料
const buttons = [
    {text: '平時設攤宣導問答', emoji:'📝', href:'quiz.html', cls:'btn-quiz'},
    {text: '智慧牌對對', emoji:'🃏', href:'card.html', cls:'btn-card'},
    {text: '地寶追追追', emoji:'🔎', href:'q-find.html', cls:'btn-find'},
    {text: '智慧拼好屋', emoji:'🧩', href:'pintoo.html', cls:'btn-pintoo'},
    {text: '尋寶挑戰2', emoji:'🔍', href:'q-find-2.html', cls:'btn-find2'},
    // 以後新增按鈕只要在這裡加一筆
    // {text: '新的遊戲', emoji:'🎮', href:'newgame.html', cls:'btn-game'},
];

// 生成按鈕
buttons.forEach(b => addButton(b.text, b.emoji, b.href, b.cls));
</script>

</body>
</html>
