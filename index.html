<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>🌟 租稅｜宣導活動入口</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    -webkit-box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background-color: #fceecb;
    background-image: -webkit-repeating-linear-gradient(
        45deg,
        #fceecb,
        #fceecb 30px,
        #f7dfa3 30px,
        #f7dfa3 60px
    );
    background-image: repeating-linear-gradient(
        45deg,
        #fceecb,
        #fceecb 30px,
        #f7dfa3 30px,
        #f7dfa3 60px
    );
    margin: 0;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    padding: 40px 0;
}
main {
    position: relative;
    z-index: 10;
    text-align: center;
    width: 100%;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
}
.container {
    background: #ffffff;
    padding: 50px 35px;
    border-radius: 30px;
    border: 6px solid #2c3e50;
    box-shadow: 12px 12px 0px #2c3e50;
    max-width: 960px;
    width: 92%;
    position: relative;
}
.stage-tag {
    display: inline-block;
    background: #f1c40f;
    color: #2c3e50;
    font-weight: 900;
    font-size: 16px;
    padding: 8px 22px;
    border: 3px solid #2c3e50;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 4px 4px 0px #2c3e50;
    margin-bottom: 30px;
    transform: rotate(-1.5deg);
}
.button-grid {
    display: -ms-grid;
    display: grid;
    -ms-grid-columns: (1fr)[3];
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 15px 0;
}
@media (max-width: 768px) {
    .button-grid {
        -ms-grid-columns: (1fr)[2];
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
}
@media (max-width: 480px) {
    .button-grid {
        -ms-grid-columns: 1fr;
        grid-template-columns: 1fr;
        gap: 14px;
    }
}
.btn {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    padding: 20px 15px;
    text-decoration: none;
    border-radius: 20px;
    font-size: 19px;
    font-weight: 900;
    border: 3px solid #2c3e50;
    position: relative;
    top: 0;
    min-height: 76px;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-transition: -webkit-transform 0.2s ease, -webkit-filter 0.2s ease, box-shadow 0.2s ease;
    transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease, -webkit-transform 0.2s ease, -webkit-filter 0.2s ease;
}
.btn span {
    margin-right: 10px;
    font-size: 26px;
    -ms-flex-negative: 0;
    flex-shrink: 0;
}
.btn-quiz {
    background: #f1c40f;
    color: #2c3e50;
    border-bottom: 7px solid #d4ac0d;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
}
.btn-card {
    background: #3498db;
    color: #ffffff;
    border-bottom: 7px solid #2980b9;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-find {
    background: #2ecc71;
    color: #ffffff;
    border-bottom: 7px solid #27ae60;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-pintoo {
    background: #9b59b6;
    color: #ffffff;
    border-bottom: 7px solid #8e44ad;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-find2 {
    background: #e67e22;
    color: #ffffff;
    border-bottom: 7px solid #d35400;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-monopoly {
    background: #e74c3c;
    color: #ffffff;
    border-bottom: 7px solid #c0392b;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-placeholder1 {
    background: #1abc9c;
    color: #ffffff;
    border-bottom: 7px solid #16a085;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-placeholder2 {
    background: #fd79a8;
    color: #ffffff;
    border-bottom: 7px solid #e84393;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-placeholder3 {
    background: #5f27cd;
    color: #ffffff;
    border-bottom: 7px solid #341f97;
    box-shadow: 0 6px 0 rgba(44, 62, 80, 0.25);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.25);
}
.btn-placeholder1, .btn-placeholder2, .btn-placeholder3 {
    filter: saturate(0.95);
}
.btn:hover {
    -webkit-transform: translateY(-4px);
    transform: translateY(-4px);
    -webkit-filter: brightness(1.08);
    filter: brightness(1.08);
    box-shadow: 0 10px 0 rgba(44, 62, 80, 0.35);
}
.btn:active {
    -webkit-transform: translateY(4px);
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(44, 62, 80, 0.25);
    border-bottom-width: 3px;
}
.btn.locked {
    cursor: not-allowed;
    opacity: 0.84;
}
</style>
</head>
<body>

<main>
    <div class="container">
        <div class="stage-tag">STAGE SELECT</div>
        <div class="button-grid"></div>
    </div>
</main>

<script>
const gridContainer = document.querySelector('.button-grid');

function addButton(text, emoji, href, btnClass, locked = false) {
    const btn = document.createElement('a');
    btn.href = href;
    btn.className = 'btn ' + btnClass + (locked ? ' locked' : '');

    if (locked) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            alert('此關卡尚未開放，敬請期待！');
        });
    }

    const span = document.createElement('span');
    span.textContent = emoji;
    btn.appendChild(span);
    btn.appendChild(document.createTextNode(' ' + text));

    gridContainer.appendChild(btn);
}

const buttons = [
    {text: '平時設攤宣導問答', emoji:'📝', href:'quiz.html', cls:'btn-quiz'},
    {text: '智慧牌對對', emoji:'🃏', href:'card.html', cls:'btn-card'},
    {text: '地寶追追追', emoji:'🔎', href:'q-find.html', cls:'btn-find'},
    {text: '智慧拼好屋', emoji:'🧩', href:'pintoo.html', cls:'btn-pintoo'},
    {text: '尋寶挑戰2', emoji:'🔍', href:'q-find-2.html', cls:'btn-find2'},
    {text: '刨冰大挑戰', emoji:'🧊', href:'ice.html', cls:'btn-monopoly'},
    {text: '0716夏令營', emoji:'💻', href:'0716.html', cls:'btn-placeholder1'},
    {text: '0717夏令營', emoji:'💻', href:'0717.html', cls:'btn-placeholder2'},
    {text: '史前迷宮', emoji:'🧱', href:'history.html', cls:'btn-placeholder3'},

    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-quiz', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-card', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-find', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-pintoo', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-find2', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-monopoly', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-placeholder1', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-placeholder2', locked:true},
    {text: '敬請期待', emoji:'🔒', href:'#', cls:'btn-placeholder3', locked:true}
];

buttons.forEach(b => addButton(b.text, b.emoji, b.href, b.cls, b.locked));
</script>

</body>
</html>
