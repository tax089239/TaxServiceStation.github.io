<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧稅趣園遊會 - 地寶追追追</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /*頁面整體設計*/
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #bfe8ff;
            user-select: none;
            overflow: hidden;
        }
        /*園遊會風格柔和漸層背景*/
        .sky-meadow-bg {
            background: linear-gradient(to bottom, #bfe8ff 0%, #dff4ff 50%, #eef9ff 70%, #dcfce7 70%, #bbf7d0 100%);
            background-size: 100% 100%;
        }
        /*雲朵漂浮動畫*/
        @keyframes floatClouds {
            0% { transform: translateX(-10%); }
            100% { transform: translateX(110%); }
        }
        .cloud-1 { animation: floatClouds 35s linear infinite; }
        .cloud-2 { animation: floatClouds 45s linear infinite; animation-delay: -15s; }
        .cloud-3 { animation: floatClouds 55s linear infinite; animation-delay: -5s; }
        
        /* 寶物自轉與微幅漂浮 */
        @keyframes treasureFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(4deg); }
        }
        /*【假寶物動畫】*/
        .treasure-active {
            animation: treasureFloat 2.2s ease-in-out infinite;
            transition: left 3.0s ease-in-out, top 3.0s ease-in-out;
        }
        /*【真寶物發光特效】*/
      @keyframes jadeGlow {
    0%, 100% {
        filter:
            drop-shadow(0 0 8px rgba(255, 215, 0, 1))
            drop-shadow(0 0 15px rgba(255, 193, 7, 0.8));
    }

    50% {
        filter:
            drop-shadow(0 0 15px rgba(255, 215, 0, 1))
            drop-shadow(0 0 25px rgba(255, 193, 7, 1));
    }
}
        /*【真正寶物動畫】*/
        .real-target {
            animation: treasureFloat 1.8s ease-in-out infinite, jadeGlow 1.5s ease-in-out infinite;
            transition: left 2.5s ease-in-out, top 2.5s ease-in-out;
        }
        .scale-up {
            animation: scaleUpEffect 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes scaleUpEffect {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .shake-element {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>

<body class="sky-meadow-bg text-slate-800 h-screen w-screen overflow-hidden flex flex-col justify-between relative">
    <!-- =====================================================
         【背景裝飾區】
    ====================================================== -->

    <!-- =====================================================

    ====================================================== -->

    <div id="admin-btn" class="absolute top-4 right-4 z-[9999]">

    <!-- =====================================================

    </div>

    <!-- =====================================================

    <!-- =====================================================

    <!-- =====================================================

                <svg class="w-16 h-16 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138z"></path></svg>
            </div>
            <h2 class="text-3xl font-black text-emerald-600 mb-4">🎉 挑戰成功！</h2>
            <p class="text-slate-600 text-lg font-bold leading-relaxed mb-8">您已正確解答智慧稅務挑戰！</p>
            <div class="flex flex-col gap-3 w-full">
            <button onclick="resetGame()"class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-xl shadow-lg">下一位 🔄 </button>
            </div>
        </div>
    </div>
       <div id="admin-login-modal" class="fixed inset-0 bg-black/50 hidden z-[99999] flex items-center justify-center">
    <div class="bg-white p-6 rounded-3xl w-80">
        <h2 class="text-xl font-black mb-4"> 管理員登入 </h2>
        <input 
            id="admin-password"
            type="password"
            placeholder="請輸入密碼"
            class="w-full border p-3 rounded-xl mb-4">
        <button onclick="loginAdmin()" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold"> 登入 </button>
        <button onclick="closeAdminLogin()"class="w-full bg-slate-500 text-white py-3 rounded-xl font-bold mt-2">取消 </button>
        </div>
    </div>
    <div id="admin-panel" class="fixed inset-0 bg-black/50 hidden z-[99999] flex items-center justify-center">
    <div class="bg-white p-8 rounded-3xl w-[500px] max-w-[90%]">
        <h2 class="text-2xl font-black mb-6">  管理後台 </h2>
        <div class="mb-6">
            <div class="text-lg font-bold">
                完成挑戰人次：<span id="participant-count">0</span>
            </div>
        </div>
        <div class="flex flex-col gap-3">
            <button onclick="exportExcel()" class="bg-blue-500 text-white py-3 rounded-xl font-bold"> 📊 匯出Excel </button>
            <button onclick="clearData()" class="bg-red-500 text-white py-3 rounded-xl font-bold"> 🗑️ 清空資料 </button>
            <button onclick="closeAdminPanel()" class="bg-slate-500 text-white py-3 rounded-xl font-bold"> ❌ </button>
        </div>

</div>
    
    <script>
        /* ========================================
             DOM 元素綁定 
           ======================================== */
        const startScreen = document.getElementById("start-screen");
        const gameScreen = document.getElementById("game-screen");
        const finishScreen = document.getElementById("finish-screen");
        const gameArea = document.getElementById("game-area");
        const timerElement = document.getElementById("timer");
        const levelDisplay = document.getElementById("level-display");
        const progressBar = document.getElementById("progress-bar");
        const questionModal = document.getElementById("question-modal");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const toastOverlay = document.getElementById("toast-overlay");
        const toastTitle = document.getElementById("toast-title");
        const toastMessage = document.getElementById("toast-message");
        const toastIcon = document.getElementById("toast-icon");
        const toastBtn = document.getElementById("toast-btn");
        const adminBtn = document.getElementById("admin-btn");

        /* ========================================
             文物圖片設定區 (自動替換完成)
           ======================================== */
        const USE_CUSTOM_IMAGE = true; 
        const ARTIFACT_FILES = ["phooto1.png", "phooto2.png", "phooto3.png", "phooto4.png"];
        let currentArtifact = ""; 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try { if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'tap') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.start(now); osc.stop(now + 0.1); }
                else if (type === 'found') { osc.type = 'sine'; osc.frequency.setValueAtTime(659.25, now); osc.start(now); osc.stop(now + 0.2); }
                else if (type === 'correct') { osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.start(now); osc.stop(now + 0.3); }
                else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now); osc.start(now); osc.stop(now + 0.3); }
            } catch (e) {}
        }

        // 5 種主視覺延伸干擾物：三色氣球、雲端發票手機、太陽花、史前陶罐、普通石頭
        const fakeSVGItems = [
            // 1. 三色氣球
            `<svg viewBox="0 0 100 100" class="w-full h-full">
                <circle cx="40" cy="40" r="16" fill="#3b82f6"/>
                <path d="M40 56 L38 68" stroke="#cbd5e1" stroke-width="1.5"/>
                <circle cx="62" cy="38" r="15" fill="#ec4899"/>
                <path d="M62 53 L58 68" stroke="#cbd5e1" stroke-width="1.5"/>
                <circle cx="50" cy="48" r="17" fill="#f59e0b"/>
                <path d="M50 65 L48 80" stroke="#cbd5e1" stroke-width="1.5"/>
                <circle cx="48" cy="80" r="1.5" fill="#94a3b8"/>
            </svg>`,
            // 2. 智慧稅：雲端發票載具手機
            `<svg viewBox="0 0 100 100" class="w-full h-full">
                <rect x="28" y="15" width="44" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
                <rect x="32" y="20" width="36" height="52" rx="4" fill="#f8fafc"/>
                <circle cx="50" cy="17.5" r="1.5" fill="#475569"/>
                <rect x="38" y="28" width="24" height="15" fill="#ffffff" stroke="#000" stroke-width="1"/>
                <line x1="42" y1="30" x2="42" y2="41" stroke="#000" stroke-width="2"/>
                <line x1="46" y1="30" x2="46" y2="41" stroke="#000" stroke-width="1"/>
                <line x1="49" y1="30" x2="49" y2="41" stroke="#000" stroke-width="3"/>
                <line x1="53" y1="30" x2="53" y2="41" stroke="#000" stroke-width="1"/>
                <line x1="56" y1="30" x2="56" y2="41" stroke="#000" stroke-width="2"/>
                <line x1="59" y1="30" x2="59" y2="41" stroke="#000" stroke-width="1"/>
                <path d="M45 62 C42 62 40 60 41 57 C39 56 39 53 42 52 C43 50 47 49 49 51 C51 49 55 51 55 53 C57 53 58 56 56 58 C57 60 55 62 51 62 Z" fill="#38bdf8"/>
                <circle cx="50" cy="78" r="3" fill="#475569"/>
            </svg>`,
            // 3. 園遊會小黃花
            `<svg viewBox="0 0 100 100" class="w-full h-full">
                <path d="M50 50 Q48 75 40 90" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
                <path d="M48 68 Q32 60 38 52 Q44 60 48 68 Z" fill="#22c55e"/>
                <circle cx="50" cy="30" r="11" fill="#fbbf24"/>
                <circle cx="50" cy="70" r="11" fill="#fbbf24"/>
                <circle cx="30" cy="50" r="11" fill="#fbbf24"/>
                <circle cx="70" cy="50" r="11" fill="#fbbf24"/>
                <circle cx="36" cy="36" r="11" fill="#fbbf24"/>
                <circle cx="64" cy="64" r="11" fill="#fbbf24"/>
                <circle cx="64" cy="36" r="11" fill="#fbbf24"/>
                <circle cx="36" cy="64" r="11" fill="#fbbf24"/>
                <circle cx="50" cy="50" r="14" fill="#ea580c"/>
            </svg>`,
            // 4. 史前陶罐
            `<svg viewBox="0 0 100 100" class="w-full h-full">
                <path d="M35 25 C35 15 65 15 65 25 L60 32 C75 38 80 62 70 78 C62 90 38 90 30 78 C20 62 25 38 40 32 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
                <path d="M36 32 Q50 38 64 32" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="3 3"/>
                <path d="M28 55 Q50 65 72 55" fill="none" stroke="#78350f" stroke-width="3"/>
                <path d="M26 63 Q50 73 74 63" fill="none" stroke="#78350f" stroke-width="2"/>
            </svg>`,
            // 5. 普通卵石
            `<svg viewBox="0 0 100 100" class="w-full h-full">
                <path d="M25 50 C20 30 40 20 65 25 C85 30 90 55 80 70 C70 85 45 85 30 80 C20 75 30 70 25 50 Z" fill="#64748b" stroke="#475569" stroke-width="3"/>
                <path d="M40 35 Q55 30 65 40" fill="none" stroke="#94a3b8" stroke-width="2"/>
            </svg>`
        ];

        const questions = [
            { question: "自用住宅用地要申請優惠稅率要在幾月幾號之前申請?", options: ["8/30", "9/22", "不用另外申請"], answer: 1 },
            { question: "地價稅自用住宅用地優惠稅率是多少?", options: ["1‰", "2‰", "10‰"], answer: 1 },
            { question: "地價稅開徵期間是幾月?", options: ["4月", "5月", "11月"], answer: 2 },
            { question: "地價稅納稅義務基準日始幾月幾號?", options: ["6/30", "7/15", "8/31"], answer: 2 }
        ];

        let activeQuestion = null; let timer = 60; let timerInterval; let targetInterval; let fakeIntervals = []; 
        let targetElement; let fakeElements = []; let answerAttempts = 0; let answerLogs = JSON.parse( localStorage.getItem("answerLogs") || "[]");
        
        function showCustomToast(title, message, icon, onCloseCallback) {
            toastTitle.innerText = title; toastMessage.innerText = message; toastIcon.innerText = icon;
            toastOverlay.classList.remove("hidden");
            toastBtn.onclick = () => { toastOverlay.classList.add("hidden"); if (onCloseCallback) onCloseCallback(); };
        }

        function startGame() {
            adminBtn.classList.add("hidden");
            startScreen.classList.add("hidden"); finishScreen.classList.add("hidden"); gameScreen.classList.remove("hidden");
            activeQuestion = questions[Math.floor(Math.random() * questions.length)];
            currentArtifact = ARTIFACT_FILES[Math.floor(Math.random() * ARTIFACT_FILES.length)];
            timer = 60; timerElement.innerText = timer;
            startTimer(); startRound();
        }

        function startRound() {
            clearAllGameIntervals(); gameArea.innerHTML = "";
            levelDisplay.innerText = "地寶追追追"; progressBar.style.width = "0%";
            // ===== 真寶物 =====
            targetElement = document.createElement("div");targetElement.className = "absolute w-20 h-20 md:w-24 md:h-24 cursor-pointer real-target z-20";
            targetElement.innerHTML = `<img src="${currentArtifact}" class="w-full h-full object-contain pointer-events-none" onerror="this.onerror=null;this.src='https://cdn-icons-png.flaticon.com/512/599/599995.png';">`;
            targetElement.onclick = (e) => { e.stopPropagation(); playSound('found'); clearAllGameIntervals(); showQuestion(); };
            setRandomPosition(targetElement); gameArea.appendChild(targetElement);
            // 立即移動一次
            moveElementRandomly(targetElement);
            // ===== 假寶物 =====
            for (let i = 0; i < 15; i++) {
                const fake = document.createElement("div");
                fake.className = "absolute w-16 h-16 md:w-20 md:h-20 cursor-pointer treasure-active z-10 opacity-90";
                fake.innerHTML = fakeSVGItems[i % fakeSVGItems.length]; setRandomPosition(fake); gameArea.appendChild(fake);
                // 立即移動一次
                moveElementRandomly(fake);
                    fake.onclick = (e) => { e.stopPropagation(); playSound('tap');
                    fake.classList.add("shake-element");
                setTimeout(() => {
                    fake.classList.remove("shake-element"); }, 400); };
                fakeIntervals.push( setInterval(() => moveElementRandomly(fake), 1500) ); }
                // 真寶物移動
                targetInterval = setInterval( () => moveElementRandomly(targetElement), 1000 );
        }

        function setRandomPosition(el) {
            const maxX = gameArea.clientWidth - el.offsetWidth;
            const maxY = gameArea.clientHeight - el.offsetHeight;
                el.style.left = `${Math.random() * maxX}px`;
                el.style.top = `${Math.random() * maxY}px`;
        }
        function moveElementRandomly(el) { if(el) setRandomPosition(el); }
        function clearAllGameIntervals() { clearInterval(targetInterval); fakeIntervals.forEach(clearInterval); fakeIntervals = []; }

        function showQuestion() {
            activeQuestion = questions[Math.floor(Math.random() * questions.length)];
            answerAttempts = 0;
            questionText.innerText = activeQuestion.question; optionsContainer.innerHTML = "";
            activeQuestion.options.forEach((opt, i) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-100 font-black text-2xl text-slate-700";
                btn.innerHTML = `<div class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-amber-400 text-white flex items-center justify-center">${i+1}</span>${opt}</div>`;
                btn.onclick = () => {
                    if(i === activeQuestion.answer) {
                        answerAttempts++;
                         answerLogs.push({
                            序號: answerLogs.length + 1,
                            題目: activeQuestion.question,
                            作答次數: answerAttempts,
                            作答時間: new Date().toLocaleString()
                        });
                        saveLogs();updateParticipantCount();
                        playSound('correct'); btn.classList.replace("bg-emerald-50", "bg-emerald-500"); btn.classList.add("text-white");
                        progressBar.style.width = "100%"; setTimeout(() => { questionModal.classList.add("hidden"); finishGame(); }, 1000);
                    } else {
                        answerAttempts++; playSound('wrong'); showCustomToast("再試一次", "答案不對唷，再仔細想想！", "🧐");
                    }
                 };
                optionsContainer.appendChild(btn);
            });
            questionModal.classList.remove("hidden");
        }
        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(answerLogs);
            const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "答題紀錄" );
                XLSX.writeFile(wb, `地寶追追追紀錄_${new Date().getTime()}.xlsx`);
        }
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--; timerElement.innerText = timer;
                if (timer <= 0) { clearInterval(timerInterval); clearAllGameIntervals(); resetGame(); }
            }, 1000);
        }
        function openAdminLogin() {
            document.getElementById("admin-login-modal").classList.remove("hidden");}
        function loginAdmin() {
            const pwd =document.getElementById("admin-password").value;
                if (pwd === "231600") {
                     document.getElementById("admin-password").value = "";
                    document.getElementById("admin-login-modal").classList.add("hidden");updateParticipantCount();
                    document.getElementById("admin-panel").classList.remove("hidden");
                } else {alert("密碼錯誤");
            }
        }
        function closeAdminPanel() {
            document.getElementById("admin-panel").classList.add("hidden");}
        function updateParticipantCount() {
            document.getElementById("participant-count").textContent = answerLogs.length;}
        function clearData() {
            if (!confirm("確定清空所有紀錄？")) return;
            answerLogs = [];localStorage.removeItem("answerLogs");
            updateParticipantCount();alert("資料已清空");}
        function closeAdminLogin() { document.getElementById("admin-login-modal").classList.add("hidden");}
        function saveLogs() {localStorage.setItem("answerLogs",JSON.stringify(answerLogs));}
        document.getElementById("admin-password").addEventListener("keypress", function(e){if(e.key === "Enter"){loginAdmin();}});
        function finishGame() { clearInterval(timerInterval); clearAllGameIntervals(); gameScreen.classList.add("hidden"); finishScreen.classList.remove("hidden"); }
        function resetGame() { adminBtn.classList.remove("hidden");clearInterval(timerInterval); clearAllGameIntervals(); finishScreen.classList.add("hidden"); gameScreen.classList.add("hidden"); startScreen.classList.remove("hidden"); }
    </script>
</body>
</html>
