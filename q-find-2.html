<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租稅考古探險遊戲</title>
    <!-- 引入 React 與 Babel (以便在瀏覽器直接解析 JSX) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        @keyframes float-slow { 
            0%, 100% { transform: translate(0, 0); } 
            50% { transform: translate(15px, -10px); } 
        }
        .animate-bounce-gentle { animation: bounce-gentle 4s ease-in-out infinite; }
        .animate-float-slow { animation: float-slow 12s ease-in-out infinite; }
        .animate-wiggle { animation: wiggle 2s ease-in-out infinite; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }
    </style>
</head>
<body class="bg-[#FDF8F1]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // 圖示組件適配器
        const Icon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.createIcons();
                }
            }, []);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        // --- 圖片資源配置區 ---
        const IMAGE_ASSETS = {
            bgArtifact1: "", 
            bgArtifact2: "",
            target1: "", 
            other1: "",  
            other2: "",  
            other3: "",  
        };

        const AssetDisplay = ({ src, emoji, className = "" }) => {
            if (src) {
                return <img src={src} alt="artifact" className={`object-contain ${className}`} onError={(e) => e.target.style.display='none'} />;
            }
            return <span className={className}>{emoji}</span>;
        };

        const GAME_CONFIG = {
            adminPassword: "admin123", 
            collectionTarget: 3,        
            gameTimeLimit: 30,          
            questionsPerGame: 5,        
            targetText: "目標：捕捉 3 件游走的古文物！", 
        };

        const QUESTION_BANK = [
            { id: 1, text: "下列哪一項不是我國的主要稅收來源？", options: ["所得稅", "營業稅", "珍珠奶茶稅", "關稅"], answer: "珍珠奶茶稅" },
            { id: 2, text: "每年 5 月是申報哪種稅的日子？", options: ["地價稅", "綜合所得稅", "燃料稅", "房屋稅"], answer: "綜合所得稅" },
            { id: 3, text: "購物時索取統一發票，主要目的是什麼？", options: ["幫助店家記帳", "增加中獎機會", "防止商家逃漏稅", "以上皆是"], answer: "以上皆是" },
            { id: 4, text: "納稅是國民的義務，這屬於憲法中的規定嗎？", options: ["是", "不是", "看心情", "只有有錢人才要"], answer: "是" },
            { id: 5, text: "電子發票中獎後，可以自動匯入載具歸戶的帳戶嗎？", options: ["可以", "不可以", "要看運氣", "只限100萬元以上"], answer: "可以" },
            { id: 6, text: "雲端發票除了原本獎項，還有專屬的『雲端發票專屬獎』嗎？", options: ["有", "沒有", "只有過年有", "只限特定店家"], answer: "有" },
        ];

        const ARTIFACT_TYPES = [
            { id: 'a1', icon: '🏺', img: IMAGE_ASSETS.target1, isTarget: true },
            { id: 'o1', icon: '🥥', img: IMAGE_ASSETS.other1, isTarget: false },
            { id: 'o2', icon: '🍃', img: IMAGE_ASSETS.other2, isTarget: false },
            { id: 'o3', icon: '🐚', img: IMAGE_ASSETS.other3, isTarget: false },
        ];

        function App() {
            const [view, setView] = useState('home'); 
            const [records, setRecords] = useState([]);
            const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
            const [quizSet, setQuizSet] = useState([]);
            const [collectedCount, setCollectedCount] = useState(0);
            const [timeLeft, setTimeLeft] = useState(GAME_CONFIG.gameTimeLimit);
            const [artifacts, setArtifacts] = useState([]);

            useEffect(() => {
                const saved = localStorage.getItem('tax_game_records');
                if (saved) setRecords(JSON.parse(saved));
                if (window.lucide) window.lucide.createIcons();
            }, [view]);

            const startGame = () => {
                const shuffled = [...QUESTION_BANK].sort(() => 0.5 - Math.random());
                setQuizSet(shuffled.slice(0, GAME_CONFIG.questionsPerGame));
                setCurrentQuizIndex(0);
                setView('quiz');
            };

            const handleAnswer = (option) => {
                const currentQ = quizSet[currentQuizIndex];
                if (option === currentQ.answer) {
                    if (currentQuizIndex + 1 < quizSet.length) {
                        setCurrentQuizIndex(currentQuizIndex + 1);
                    } else {
                        startCollection();
                    }
                } else {
                    alert("答錯囉！再想想看！");
                }
            };

            const startCollection = () => {
                setCollectedCount(0); 
                setTimeLeft(GAME_CONFIG.gameTimeLimit); 
                setView('collection');
                const initialArtifacts = Array.from({ length: 18 }, () => ({
                    id: Math.random(),
                    type: ARTIFACT_TYPES[Math.floor(Math.random() * ARTIFACT_TYPES.length)],
                    x: Math.random() * 80 + 10,
                    y: Math.random() * 50 + 25,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 20 + 60, 
                }));
                setArtifacts(initialArtifacts);
            };

            useEffect(() => {
                if (view !== 'collection' || timeLeft <= 0) return;
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(timer);
            }, [view, timeLeft]);

            useEffect(() => {
                if (view !== 'collection' || timeLeft <= 0 || collectedCount >= GAME_CONFIG.collectionTarget) {
                    if (view === 'collection' && (timeLeft === 0 || collectedCount >= GAME_CONFIG.collectionTarget)) {
                        setView('result');
                    }
                    return;
                }
                let animId;
                const updateMovement = () => {
                    setArtifacts(prev => prev.map(art => {
                        let nextX = art.x + art.vx;
                        let nextY = art.y + art.vy;
                        let nextVx = art.vx;
                        let nextVy = art.vy;
                        if (nextX <= 5 || nextX >= 90) nextVx *= -1;
                        if (nextY <= 20 || nextY >= 85) nextVy *= -1;
                        return { ...art, x: nextX, y: nextY, vx: nextVx, vy: nextVy };
                    }));
                    animId = requestAnimationFrame(updateMovement);
                };
                animId = requestAnimationFrame(updateMovement);
                return () => cancelAnimationFrame(animId);
            }, [view, timeLeft, collectedCount]);

            return (
                <div className="min-h-screen text-slate-800 flex flex-col relative overflow-hidden">
                    {view === 'home' && (
                        <div className="flex-1 flex flex-col items-center justify-center p-4">
                            <div className="animate-bounce-gentle mb-8">
                                <AssetDisplay emoji="🏺" className="text-9xl" />
                            </div>
                            <h1 className="text-5xl font-black mb-4">租稅考古探險</h1>
                            <button onClick={startGame} className="bg-emerald-700 text-white px-12 py-5 rounded-full text-2xl font-bold shadow-xl hover:bg-emerald-800 transition-all">
                                開始探險
                            </button>
                        </div>
                    )}

                    {view === 'quiz' && (
                        <div className="flex-1 flex flex-col items-center justify-center p-4">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full border-b-8 border-emerald-700">
                                <h2 className="text-2xl font-black mb-6 text-center">{quizSet[currentQuizIndex]?.text}</h2>
                                <div className="space-y-3">
                                    {quizSet[currentQuizIndex]?.options.map((opt, i) => (
                                        <button key={i} onClick={() => handleAnswer(opt)} className="w-full p-4 text-left bg-slate-50 rounded-xl border-2 hover:border-emerald-500 font-bold transition-all">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'collection' && (
                        <div className="fixed inset-0 bg-[#f9fbf9] overflow-hidden">
                            <div className="absolute top-10 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-4">
                                <div className="bg-white/90 p-4 rounded-3xl shadow-xl flex flex-col items-center gap-2 border-2 border-emerald-100">
                                    <div className="flex justify-between w-full items-center">
                                        <div className="text-3xl font-black text-amber-600">⏱ {timeLeft}s</div>
                                        <div className="flex gap-2">
                                            {[...Array(GAME_CONFIG.collectionTarget)].map((_, i) => (
                                                <div key={i} className={`w-12 h-12 rounded-xl border-2 flex items-center justify-center ${i < collectedCount ? 'bg-amber-400' : 'bg-white opacity-30'}`}>🏺</div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="w-full bg-emerald-800 text-white text-center py-2 rounded-xl font-bold">
                                        {GAME_CONFIG.targetText}
                                    </div>
                                </div>
                            </div>
                            <div className="absolute inset-0">
                                {artifacts.map(item => (
                                    <button 
                                        key={item.id} 
                                        onClick={() => {if(item.type.isTarget) setCollectedCount(c => c+1); setArtifacts(prev => prev.filter(a => a.id !== item.id))}}
                                        className="absolute p-2 transition-transform active:scale-75"
                                        style={{ top: `${item.y}%`, left: `${item.x}%`, transform: 'translate(-50%, -50%)' }}
                                    >
                                        <AssetDisplay emoji={item.type.icon} className="text-6xl" />
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'result' && (
                        <div className="flex-1 flex flex-col items-center justify-center p-4">
                            <div className="bg-white p-12 rounded-[3rem] shadow-2xl text-center border-8 border-emerald-50">
                                <div className="text-8xl mb-6">{collectedCount >= 3 ? '🏆' : '💀'}</div>
                                <h2 className="text-4xl font-black mb-4">{collectedCount >= 3 ? '探險大成功！' : '探險失敗'}</h2>
                                <button onClick={() => setView('home')} className="bg-emerald-800 text-white px-10 py-4 rounded-full text-xl font-bold">回首頁</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
